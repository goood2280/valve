# Vehicle 정의 — Ref config.yaml 과 동일한 키 체계
# QueryTimeSpan(일)  전체 조회 기간 / SplitTimeSpan(일)  분할(split) 단위
# event_days_back    event 재처리 대상 일수
# event_lot_startwith  root_lot_id prefix 1차 필터
# runs_per_day       하루 자동 실행 횟수 (3=8시간 간격 · 6=4시간 간격 · 0=자동 실행 안 함)
#                    생략하면 pipeline.yaml 의 runtime.interval_hours 를 따른다.
#                    중요한 제품만 자주 돌리고 싶을 때 이 값만 올리면 된다.
#                    알람 탭 › 파이프라인 처리 현황에서 웹으로도 조절 가능.
VH_PRODA:
  vehicle: VH_PRODA
  product: PRODA
  process_id: P100
  line_id:
  - L1
  QueryTimeSpan: 6
  SplitTimeSpan: 3
  event_days_back: 7
  event_lot_startwith: R
  runs_per_day: 6
VH_PRODB:
  vehicle: VH_PRODB
  product: PRODB
  process_id: P200
  line_id:
  - L2
  QueryTimeSpan: 6
  SplitTimeSpan: 3
  event_days_back: 7
  event_lot_startwith: R
  runs_per_day: 3
