# Valve 파이프라인 설정 (raw → event → feature → wide → send)
# ══════════════════════════════════════════════════════════════════════
# ※ 이 파일은 웹에서 설정을 저장할 때마다 통째로 다시 쓰인다.
#    값은 그대로 보존되지만 yaml 주석은 "파일 맨 앞 주석 블록"만 살아남는다.
#    그래서 설명은 전부 여기(맨 위)에 모아 둔다 — 키 옆에 주석을 달면 지워진다.
#
# db_root            db 산출물 루트 (ROOT 기준 상대)
#
# runtime — 실행 계획 / 주기 -------------------------------------------
#   raw_days         한 번 실행할 때 조회할 최근 일수
#   split_days       raw 유닛 분할 단위 (1 = 하루씩)
#   raw_api_max      전 vehicle 합친 동시 raw 쿼리 상한 (사내 API 풀 보호)
#   vehicle_workers  동시에 처리할 vehicle 수. vehicle 내부는 raw→event→feature 순차
#   max_workers / feature_workers / mem_per_worker_gb / cpu_cores
#                    auto = 호스트 자원으로 산정 (모니터 탭에 산정근거 표시)
#
#   주기 실행 — raw→event→feature→wide 전 단계가 제품별 주기로 자동 실행
#   (feature 는 event DB 전체 대상).
#     interval_hours   vehicles.yaml 에 runs_per_day 가 없는 제품의 기본 주기
#     schedule_enabled 자동 실행 마스터 스위치 (끄면 제품 설정과 무관하게 전부 정지)
#     sched_tick_sec   "돌 때가 된 제품" 을 확인하는 간격 — 주기 자체가 아니다
#     loop_enabled     쉬지 않고 반복 실행 (개발·백필용)
#
#   raw 실패 유닛 재시도 — 실패한 (source×날짜) 유닛은 raw_days 윈도우를
#   벗어나도 재시도 큐(logs/pipeline_retries.json)에 남는다.
#     retry_delays_sec          시도 횟수별 대기 (마지막 값으로 고정 반복)
#     retry_max_attempts        이 횟수 연속 실패하면 자동 재시도를 멈추고(blocked)
#                               critical 로 올린다 — 자격증명 만료처럼 사람이 고칠
#                               문제로 보고 무한히 사내 API 를 두드리지 않는다.
#                               고친 뒤 알람 탭의 '재시도 재개' 로 다시 큐에 넣는다
#     retry_critical_after_sec  이 시간 넘게 밀리면 severity=critical (기본 12h)
#     retry_critical_attempts   이 횟수 이상 실패해도 critical
#   자동 실행(스케줄)이 꺼진 제품은 재시도도 자동으로 돌지 않는다 — 수동 실행 시 함께 처리.
#
# db_warn_gb — 제품 하나의 DB(raw+event+feature+reports)가 이 크기를 넘으면 경고.
#              자동 삭제는 하지 않는다 (무엇을 지울지는 사람이 판단).
#
#   실행 금지 시간대 — 이 구간에는 자동 실행(스케줄·루프)을 띄우지 않는다.
#     quiet_enabled / quiet_start / quiet_end   서버 로컬 시각 "HH:MM"
#     · start > end 면 자정을 넘는 구간 (예 '23:00' ~ '02:00')
#     · 사람이 누르는 수동 실행은 막지 않는다
#     · 이미 돌고 있는 실행은 중단하지 않는다 (끊으면 event 파티션이 반만 남는다)
#     · 예정은 건너뛰지 않고 해제 시각으로 밀린다
#     · 키가 없으면 코드 기본값 00:00~02:00 이 적용된다
#     · 손으로 고칠 땐 따옴표를 붙일 것 — 9:00 은 yaml 이 540 으로 읽는다
#
# sources — 소스별 추출 테이블/컬럼 -------------------------------------
#   time_col   raw 를 date= 파티션으로 나누는 기준 열. 전 소스를 tkout_time
#              (공정 진행 시각)으로 통일한다 — 소스가 달라도 같은 날짜 축이 된다.
#              INLINE/VM 의 측정 시각(time)은 track-out 보다 늦게 찍혀 하루가 밀린다.
#              쿼리 구간이 여러 날에 걸쳐도 행은 이 열의 날짜로 각자 맞는 파티션에 들어간다.
#              알람 탭 ⚙ '조회 컬럼 · 파티션 기준 열' 에서 웹으로 수정한다.
#              적어 둔 열이 columns 에 없으면 저장을 거부하고, 실행 시엔 에러로 알려 준다.
#              (생략하면 자동 인식 — tkout_time 이 컬럼에 있으면 그것, 없으면 'time')
#   FAB / INLINE / VM  raw + event (event DB 를 만든다)
#   ET                 raw 전용 (event: false). auto report 와 동일한 reformatter 인식 —
#                      config/reformatter/{vehicle}_reformatter.csv 의 CATEGORY=REAL 행
#                      ITEMID 만 쿼리/저장 대상 (파일 없는 vehicle 은 ET 스킵).
#                      ADDP 는 파생식이라 raw 제외.
#
# step_matching / feature_rules — 룰북 경로 -----------------------------
#   step_matching    vehicle,product,step_id,step_desc (flow 가 S3 로 내려주는 마스터)
#   feature_rules.knob  사내 룰 형식
#                    (feature_name,function_step,rule_order,operator,value,category).
#                    flow 가 알람 판정을 반영해 내려준다. legacy 직접매핑 형식도 지원.
#
# unmatched_scan.exclude — 미매칭 step 스캔에서 뺄 eqp_id/eqp_model fnmatch 패턴
# unmatched_scan.alert_cols — 매칭알람(unmatched_step)에 실어 보낼 raw 열 (알람 탭 ⚙).
#                    raw 에 없는 열은 조용히 빠진다. 키가 없으면 코드 기본값
#                    eqp_id, eqp_model. 예시 (root_lot_id, wafer_id) 쌍은 항상
#                    example_limit 개까지 같이 실린다 — flow 매칭알람 화면과
#                    function step 추천(LLM)의 입력.
#
# knob_skip — knob step 미통과(값이 빈) wafer 처리 -----------------------
#   명시: ppid_knob.csv 의 AND 블록(같은 feature+rule_order 복수 행, category=SKIP,
#         예: "다음 main step not_null") 이 있으면 그 조건대로.
#   auto: 블록이 없는 feature 도 wafer 가 뒤쪽 step 을 지났으면 "SKIP" 처리.
#         뒤쪽 step 판별은 두 step 공동 통과 wafer 의 tkout_time 상대순서
#         (sleuth_order 미사용). 표본/비율 미달이면 보류(null 유지) 후 리포트.
#     min_support     뒤쪽 step 판별에 필요한 공동 통과 wafer 최소 수
#     after_fraction  그 중 시간이 뒤인 비율 임계
# ══════════════════════════════════════════════════════════════════════
db_root: db
runtime:
  raw_days: 5
  split_days: 1
  raw_api_max: 3
  max_workers: auto
  vehicle_workers: auto
  feature_workers: auto
  mem_per_worker_gb: 4
  cpu_cores: auto
  interval_hours: 6
  retry_delays_sec:
  - 300
  - 900
  - 1800
  - 3600
  retry_max_attempts: 5
  retry_critical_after_sec: 43200
  retry_critical_attempts: 5
  db_warn_gb: 40
  schedule_enabled: true
  sched_tick_sec: 60
  loop_enabled: false
  quiet_enabled: true
  quiet_start: 00:00
  quiet_end: 02:00
sources:
  FAB:
    table: RAW_FAB_DATA
    columns:
    - root_lot_id
    - wafer_id
    - part_id
    - tkout_time
    - step_id
    - step_desc
    - ppid
    - reticle_id
    - eqp_id
    - eqp_model
    - chamber_id
    - unit_id
    - sleuth_order
    time_col: tkout_time
  INLINE:
    table: RAW_INLINE_DATA
    columns:
    - root_lot_id
    - wafer_id
    - item_id
    - value
    - measure_pos
    - tkout_time
    - time
    time_col: tkout_time
  VM:
    table: RAW_VM_DATA
    columns:
    - root_lot_id
    - wafer_id
    - sensor_id
    - eqp_id
    - step_id
    - predicted_value
    - actual_value
    - residual
    - tkout_time
    - time
    time_col: tkout_time
  ET:
    table: f_et_test
    columns:
    - root_lot_id
    - wafer_id
    - item_id
    - et_value
    - chip_x_pos
    - chip_y_pos
    - eqp_id
    - step_seq
    - tkout_time
    time_col: tkout_time
    reformatter: config/reformatter
    event: false
step_matching: config/step_matching/vehicle_matching.csv
feature_rules:
  fab: config/feature_rules/fab.csv
  knob: config/feature_rules/ppid_knob.csv
  mask: config/feature_rules/mask.csv
  inline: config/feature_rules/inline.csv
  vm: config/feature_rules/vm.csv
unmatched_scan:
  exclude:
    eqp_id:
    - AUX_*
    eqp_model:
    - MEA-*
  alert_cols:
  - eqp_id
  - eqp_model
  example_limit: 3
knob_skip:
  enabled: true
  auto: true
  min_support: 5
  after_fraction: 0.8
